<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outdoorduckco | Hunting & Waterfowl Gear</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
    <div class="logo">Outdoorduckco</div>
    <nav class="nav">
        <a href="#products">Shop</a>
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Outdoorduckco</h1>
    <p>Waterfowl • Camo • Duck Hunting Gear</p>
</section>

<section id="products" class="products-section">
    <h2>Featured Products</h2>

    <div class="products-grid">
        <div class="product-card">
            <img src="images/product1.jpg" alt="Camo Hoodie">
            <h3>Camo Hoodie</h3>
            <p class="price">$59.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="images/product2.jpg" alt="Duck Hat">
            <h3>Mallard Hat</h3>
            <p class="price">$24.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="images/product3.jpg" alt="Decoy">
            <h3>Pintail Decoy</h3>
            <p class="price">$39.99</p>
            <button>Add to Cart</button>
        </div>
    </div>
</section>

<section id="gallery" class="gallery-section">
    <h2>Hunting Gallery</h2>

    <div class="gallery-grid">
        <img src="images/gallery1.jpg" onclick="openModal(this.src)">
        <img src="images/gallery2.jpg" onclick="openModal(this.src)">
        <img src="images/gallery3.jpg" onclick="openModal(this.src)">
        <img src="images/gallery4.jpg" onclick="openModal(this.src)">
    </div>
</section>

<div id="modal" class="modal" onclick="closeModal()">
    <img id="modalImg" class="modal-content">
</div>

<section id="contact" class="contact-section">
    <h2>Contact</h2>
    <p>Email: outdoorduckco@gmail.com</p>
</section>

<footer class="footer">
    © 2026 Outdoorduckco. All Rights Reserved.
</footer>

<script src="scripts.js"></script>
</body>
</html>
